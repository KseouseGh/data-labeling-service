<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход/Регистрация, |Data Labeling Smart Service|[]</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .toggle { margin-top: 15px; font-size: 14px; color: #666; cursor: pointer; text-decoration: underline; }
        .error { color: red; margin-top: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h2 id="formTitle">Вход</h2>
    <form id="authForm">
        <div class="form-group">
            <label>Никнейм</label>
            <input type="text" id="username" required minlength="3">
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" id="password" required minlength="6">
        </div>
        <button type="submit" id="submitBtn">Войти</button>
        <div class="error" id="errorMsg"></div>
    </form>
    <div class="toggle" id="toggleMode">Нет аккаунта? Регистрация.[!]</div>
    <script src="script.js"></script>
</body>
</html>
